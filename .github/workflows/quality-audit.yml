name: Quality Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start App
        run: |
          timeout 90 npm run start > /tmp/app.log 2>&1 &
          APP_PID=$!
          sleep 3
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "App failed to start. Output:"
            cat /tmp/app.log
            exit 1
          fi
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV

      - name: Wait for App
        run: |
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "App is ready on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30: App not ready yet, waiting..."
            sleep 2
          done
          echo "App failed to respond in time. App log:"
          cat /tmp/app.log || echo "No log file found"
          exit 1

      - name: Run Lighthouse + Axe
        continue-on-error: true
        env:
          AUDIT_URL: http://127.0.0.1:3000
          LIGHTHOUSE_PRESET: desktop
          LH_MIN_PERFORMANCE: "0.60"
          LH_MIN_ACCESSIBILITY: "0.90"
          LH_MIN_SEO: "0.95"
        run: npm run audit:ci

      - name: Upload Lighthouse Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-report
          path: lighthouse-ci.json
